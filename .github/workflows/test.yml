name: Test
on:
  pull_request: {}
  push:
    branches: [main]

# Least privilege by default. PR-head code runs here, so this workflow must
# never hold a write token or a secret (it used to run with both, via the
# base-branch "target" PR trigger).
permissions:
  contents: read

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Codecov tokenless upload (OIDC). Fork and Dependabot PR runs get no
      # OIDC token; the upload step below is skipped for them, not failed.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Assert Go toolchain
        run: bash .github/scripts/assert-go-toolchain.sh

      - name: Generate code
        uses: ./.github/actions/generate

      - name: Vet
        run: go vet -tags headless ./...

      # Blocking (Phase 6.9 SEC D5): any reachable advisory fails the job.
      # A new advisory can turn main red with no code change; that is the
      # point of the gate. Covers linux + headless only (design R13).
      # go install/run checks the module against sum.golang.org (S8545 n/a).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags headless ./...

      - name: Test CI scripts
        run: bash .github/scripts/assert-go-toolchain_test.sh && bash .github/scripts/go-deps-update_test.sh && bash .github/scripts/wails-update-check_test.sh

      - name: Run tests
        run: go test -race -count=1 -tags headless -coverprofile=coverage.out ./...

      # Fork and Dependabot PR runs get no OIDC token; the upload is skipped
      # for them, not failed.
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: true
          # Install the CLI from PyPI: the default path imports the signing key
          # from https://keybase.io/codecovsecurity/pgp_keys.asc, which now 404s,
          # so signature verification fails with "no valid OpenPGP data found".
          # See https://github.com/codecov/codecov-action/issues/1955
          use_pypi: true
          use_oidc: true

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
