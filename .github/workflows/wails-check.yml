name: Wails release check

# Weekly check for a newer stable Wails v3 release (U7). It only reports: it
# opens, or updates, one issue labelled `wails-update` and never bumps
# anything. Wails moves by hand, the Go module and @wailsio/runtime together in
# one PR (U5; go-deps.yml excludes it via GO_DEPS_EXCLUDE).
#
# Token: only this workflow's own GITHUB_TOKEN (issues: write), no secret.
# Security source: the wailsapp/wails repository-advisory API.
# Why: neither the Go vuln DB nor the global advisory DB carries Wails' v3 advisories.
# The logic lives in the portable .github/scripts/wails-update-check.sh,
# shared verbatim with the server repo.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wails-check
  cancel-in-progress: false

jobs:
  check:
    name: Check for a newer Wails release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report a newer Wails release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wails-update-check.sh
