# Bench v2 (W6 S5): build (server, loadbot, kit), gate-0 runner probe, B-0
# micro-benchmarks, the run matrix (arms S, Seq, D2 x scenarios one-big-net,
# org-op), aggregate with the publish set and two sanitiser scans, then a gated
# publish, render and deploy to the Pages site.
#
# - MANUAL ONLY. Never on schedule, push or pull_request.
# - Do NOT queue more than one run: GitHub keeps one running and one pending
#   run per concurrency group and cancels older pending ones, so a third
#   dispatch silently drops the second (design 6.2).
# - Every artefact is relative only (ratios, knees, curves) and carries the
#   runner topology label from that run's own probe. No absolute capacity
#   number is a claim about any other machine.
# - server_ref must contain cmd/vcs-benchkit with the leg, aggregate and
#   publishset subcommands (S5 or later) and tools/benchsite; an older ref
#   fails the build or run job.
# - client_ref is PINNED, not main: a moving client must not change a bench
#   result. Bump the default deliberately in the PR that needs newer loadbot
#   behaviour (mirrors client test.yml's pinned server ref). The default is
#   the loadbot v3 commit: it has no org-op scenario and no D2 InitAuth, so
#   scenarios org-op or both and arm D2 need a v4 client_ref (the C2 loadbot).
#   The bump to a v4 SHA is a follow-up after the client PR merges.
# - arms is a comma list of S, Seq, D2 (default all three). Each arm gets a
#   90 minute sweep budget (--budget 90m); a leg is hard-stopped at
#   arms x (budget + 15m), so the leg job's 340 minute limit holds 3 arms.
# - Publishing is OFF by default (publish: false) and runs only from main. The
#   publish job is the only one with contents: write and pushes only to the
#   orphan bench-results branch. The deploy job is the only one with pages:
#   write and id-token: write. The publish set goes through two independent
#   sanitiser scans (Go, then shell + jq) before it leaves the aggregate job.
# - R2 (W6 fix 2): the leg keeps the server log as server-<k>.log.gz in the
#   leg artifact and prints diagnostics itself. The Diagnostics (failed leg)
#   step is only a backstop for a leg that dies before the kit can print them.
# - Inputs never reach run: text directly; they go through env:.
name: Bench
on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: Server ref to build and bench (empty means the dispatched SHA)
        type: string
        default: ''
      client_ref:
        description: Client commit that provides vcs-loadbot (full 40-hex SHA; pinned, bumped deliberately)
        type: string
        default: 'b55823e195577506ba5c3fa2c6d16a48a5f9bd5b'
      scenarios:
        description: Scenario to run (org-op and both need a v4 client_ref)
        type: choice
        options:
          - one-big-net
          - org-op
          - both
        default: both
      arms:
        description: Comma list of arms, any of S, Seq, D2 (D2 needs a v4 client_ref)
        type: string
        default: 'S,Seq,D2'
      repeats:
        description: Independent legs per scenario, one runner VM each (1 to 5)
        type: string
        default: '3'
      layout:
        description: parallel runs all legs at once, serial runs one at a time
        type: choice
        options:
          - parallel
          - serial
        default: parallel
      profile:
        description: Leg profile (v1 has actions-short only)
        type: choice
        options:
          - actions-short
        default: actions-short
      probe_only:
        description: Skip the micro, run and aggregate jobs (build and probe still run)
        type: boolean
        default: false
      publish:
        description: Publish the sanitised results to the bench-results branch and deploy the site (main only)
        type: boolean
        default: false

permissions: {}

# Without an explicit shell, run steps use `bash -e` with no pipefail, so a
# failing benchmark piped through tee would still pass the step.
defaults:
  run:
    shell: bash

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      repeats: ${{ steps.matrix.outputs.repeats }}
      scenarios: ${{ steps.matrix.outputs.scenarios }}
    steps:
      # Inputs reach the shell only through env:. Reject anything malformed
      # before any runner time is spent.
      - name: Validate inputs
        id: matrix
        env:
          IN_REPEATS: ${{ inputs.repeats }}
          IN_SCENARIOS: ${{ inputs.scenarios }}
          IN_ARMS: ${{ inputs.arms }}
          IN_CLIENT_REF: ${{ inputs.client_ref }}
        run: |
          [[ "$IN_REPEATS" =~ ^[1-5]$ ]] || { echo "::error::repeats must be 1 to 5, got '$IN_REPEATS'"; exit 1; }
          [[ "$IN_ARMS" =~ ^(S|Seq|D2)(,(S|Seq|D2))*$ ]] || { echo "::error::arms must be a comma list of S, Seq, D2, got '$IN_ARMS'"; exit 1; }
          [ "$(printf '%s' "$IN_ARMS" | tr ',' '\n' | sort | uniq -d | wc -l)" -eq 0 ] || { echo "::error::arms lists an arm twice: '$IN_ARMS'"; exit 1; }
          [[ "$IN_CLIENT_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::client_ref must be a full 40-hex SHA"; exit 1; }
          echo "repeats=$(seq 1 "$IN_REPEATS" | jq -sc .)" >> "$GITHUB_OUTPUT"
          case "$IN_SCENARIOS" in
            one-big-net|org-op) scenarios="$(jq -nc --arg s "$IN_SCENARIOS" '[$s]')" ;;
            both) scenarios='["one-big-net","org-op"]' ;;
            *) echo "::error::scenarios must be one-big-net, org-op or both, got '$IN_SCENARIOS'"; exit 1 ;;
          esac
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.server_ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Assert Go toolchain
        run: bash .github/scripts/assert-go-toolchain.sh

      - name: Generate code
        uses: ./.github/actions/generate

      - name: Build server
        run: CGO_ENABLED=0 go build -tags headless -trimpath -o vcs-server .

      - name: Build bench kit
        run: CGO_ENABLED=0 go build -trimpath -o vcs-benchkit ./cmd/vcs-benchkit

      - name: Record server build
        run: |
          jq -n --arg sha "$(git rev-parse HEAD)" --arg go "$(go env GOVERSION)" \
            '{server_sha: $sha, go_version: $go}' > build.json

      # The client is public: no token. The pinned SHA is a deliberate input.
      - name: Checkout client
        uses: actions/checkout@v7
        with:
          repository: FPGSchiba/vcs-srs-client
          ref: ${{ inputs.client_ref }}
          path: .client
          persist-credentials: false

      # TWO TOOLCHAINS IN ONE JOB. The server was built with the server's own
      # Go above. setup-go exported GOTOOLCHAIN=local, which makes it ignore
      # go.mod's toolchain directive, so this step overrides it to auto and
      # reads the client's `toolchain` line (same pattern as client test.yml).
      - name: Set up Go (client go.mod)
        uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: .client/go.mod

      - name: Assert client Go toolchain
        run: bash .github/scripts/assert-go-toolchain.sh .client/go.mod

      # buf v1.47.2 (G-TOOL). `go run pkg@version` checks the module against
      # sum.golang.org, the same pattern test.yml uses for govulncheck (S8545).
      - name: Generate client protobuf
        working-directory: .client
        run: go run github.com/bufbuild/buf/cmd/buf@v1.47.2 generate

      - name: Build loadbot
        working-directory: .client
        run: CGO_ENABLED=0 go build -tags purego -trimpath -o "$GITHUB_WORKSPACE/vcs-loadbot" ./cmd/vcs-loadbot

      - name: Record client build
        run: |
          jq --arg sha "$(git -C .client rev-parse HEAD)" --arg go "$(cd .client && go env GOVERSION)" \
            '. + {client_sha: $sha, client_go_version: $go}' build.json > build.tmp
          mv build.tmp build.json
          cat build.json

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            vcs-server
            vcs-loadbot
            vcs-benchkit
            build.json
          if-no-files-found: error

  probe:
    name: Runner probe (gate 0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      server_set: ${{ steps.sets.outputs.server_set }}
      generator_set: ${{ steps.sets.outputs.generator_set }}
      topology_label: ${{ steps.sets.outputs.topology_label }}
    steps:
      # Scripts come from the workflow's own commit, not server_ref.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Probe self-test
        run: bash .github/scripts/bench-probe_test.sh

      - name: Probe runner
        run: bash .github/scripts/bench-probe.sh > env-probe.json

      - name: Export CPU sets
        id: sets
        run: |
          echo "server_set=$(jq -r .server_set env-probe.json)" >> "$GITHUB_OUTPUT"
          echo "generator_set=$(jq -r .generator_set env-probe.json)" >> "$GITHUB_OUTPUT"
          echo "topology_label=$(jq -r .topology_label env-probe.json)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Runner probe"
            echo
            echo "- topology: $(jq -r .topology_label env-probe.json)"
            echo "- smt: $(jq -r .smt env-probe.json)"
            echo "- cpu: $(jq -r .cpu_model env-probe.json)"
            echo "- steal seconds sampled: $(jq -r .steal_seconds env-probe.json)"
            echo
            echo "CPU split is the provisional Q6-A rule until the user decides Q6."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: env-probe
          path: env-probe.json
          if-no-files-found: error

  micro:
    name: B-0 micro-benchmarks
    needs: [build, probe]
    if: ${{ !inputs.probe_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.server_ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Assert Go toolchain
        run: bash .github/scripts/assert-go-toolchain.sh

      - name: Generate code
        uses: ./.github/actions/generate

      # The probe job ran on a different VM. Pin from this VM's own sibling
      # map, with the probe script from the workflow's commit, and record it.
      - name: Checkout probe script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .bench-wf
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Probe this runner
        id: sets
        env:
          PROBE_JOB_TOPOLOGY: ${{ needs.probe.outputs.topology_label }}
        run: |
          PROBE_STEAL_SECONDS=0 bash .bench-wf/.github/scripts/bench-probe.sh > env-probe-micro.json
          echo "server_set=$(jq -r .server_set env-probe-micro.json)" >> "$GITHUB_OUTPUT"
          topology="$(jq -r .topology_label env-probe-micro.json)"
          echo "micro runner: $topology, server set $(jq -r .server_set env-probe-micro.json)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$topology" != "$PROBE_JOB_TOPOLOGY" ]; then
            echo "::warning::micro runner topology '$topology' differs from the probe job's '$PROBE_JOB_TOPOLOGY'; label micro results from env-probe-micro.json"
          fi

      - name: Compile voice benchmarks
        run: go test -c -tags headless -o voice.test ./voice/

      - name: Run benchmarks
        env:
          SERVER_SET: ${{ steps.sets.outputs.server_set }}
        run: |
          taskset -c "$SERVER_SET" env GOMAXPROCS=2 ./voice.test -test.run '^$' -test.bench '^Benchmark(SocketSend|GetListeningClients|HandleVoicePacket)$' -test.benchmem -test.count=10 | tee micro.txt

      - name: Benchstat
        run: go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e micro.txt | tee micro-benchstat.txt

      - name: Predict knees
        run: go run ./cmd/vcs-benchkit predict --micro micro.txt --logger bus --csv micro.csv > predict.json

      - name: Upload micro results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: micro
          path: |
            micro.txt
            micro-benchstat.txt
            micro.csv
            predict.json
            env-probe-micro.json
          if-no-files-found: error

  run:
    name: Leg ${{ matrix.repeat }} (${{ matrix.scenario }})
    needs: [build, micro]
    if: ${{ !inputs.probe_only }}
    runs-on: ubuntu-latest
    # 3 arms x (90 + 15) min = 315 min, under the 360 min job limit.
    timeout-minutes: 340
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.layout == 'serial' && 1 || 20 }}
      matrix:
        repeat: ${{ fromJSON(needs.build.outputs.repeats) }}
        scenario: ${{ fromJSON(needs.build.outputs.scenarios) }}
    steps:
      # Only the probe script is needed; it comes from the workflow's commit.
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: bin

      - name: Download micro results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: micro
          path: micro

      # Each leg runs on its own VM, so it probes its own sibling map and
      # takes its CPU sets and topology label from that.
      - name: Probe this runner
        run: bash .github/scripts/bench-probe.sh > env-probe.json

      - name: Run leg
        env:
          REPEAT: ${{ matrix.repeat }}
          SCENARIO: ${{ matrix.scenario }}
          ARMS: ${{ inputs.arms }}
        run: |
          chmod +x bin/vcs-server bin/vcs-loadbot bin/vcs-benchkit
          mkdir -p results
          bin/vcs-benchkit leg \
            --server-bin "$PWD/bin/vcs-server" \
            --loadbot-bin "$PWD/bin/vcs-loadbot" \
            --scenario "$SCENARIO" \
            --arms "$ARMS" \
            --budget 90m \
            --seed "$REPEAT" \
            --out "results/${REPEAT}-${SCENARIO}" \
            --probe env-probe.json \
            --predict micro/predict.json \
            --server-sha "$(jq -r .server_sha bin/build.json)" \
            --client-sha "$(jq -r .client_sha bin/build.json)" \
            --q6 "A: server 2 vCPU, bots 2 vCPU (user, 2026-10-28)"

      # Backstop for a leg that failed before or outside the kit's own
      # diagnostics (R2): tails of the bot, calibration and reflector logs, the
      # newest kept server log and the manifest, each folded in a group. Every
      # read tolerates a missing file.
      - name: Diagnostics (failed leg)
        if: ${{ failure() }}
        env:
          REPEAT: ${{ matrix.repeat }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          dir="results/${REPEAT}-${SCENARIO}"
          for f in "$dir"/*/loadbot-*.log "$dir"/calibrate.log "$dir"/reflect.log; do
            [ -e "$f" ] || continue
            echo "::group::$f (last 50 lines)"
            tail -n 50 "$f" 2>&1 || true
            echo "::endgroup::"
          done
          srv="$(ls -t "$dir"/*/server-*.log.gz 2>/dev/null | head -n 1 || true)"
          echo "::group::${srv:-server log} (last 200 lines)"
          if [ -n "$srv" ]; then zcat "$srv" 2>&1 | tail -n 200 || true; else echo "no server log kept"; fi
          echo "::endgroup::"
          echo "::group::$dir/manifest.json"
          cat "$dir/manifest.json" 2>&1 || true
          echo "::endgroup::"

      # A failed leg still writes steps.csv, calibration.csv and the manifest
      # for inspection, so the summary and the upload run unless cancelled.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          REPEAT: ${{ matrix.repeat }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          dir="results/${REPEAT}-${SCENARIO}"
          md="$dir/results.md"
          if [ -f "$md" ]; then
            # The same table the leg already printed to the run log; it
            # carries its own "### Leg" heading.
            cat "$md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Leg ${REPEAT} ${SCENARIO}"
              echo
              found=0
              for knees in "$dir"/*/knees.csv; do
                [ -f "$knees" ] || continue
                found=1
                echo "Arm $(basename "$(dirname "$knees")")"
                echo '```'
                cat "$knees"
                echo '```'
              done
              if [ "$found" -eq 0 ]; then
                echo "No knees.csv: this leg did not finish. Partial files, if any, are in the leg artifact."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The directory name carries <repeat>-<scenario>, so merge-multiple in
      # aggregate keeps every leg's files apart.
      - name: Upload leg results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.repeat }}-${{ matrix.scenario }}
          path: results
          if-no-files-found: warn

  # The publish set is built here from the aggregate and the build and probe
  # records, then scanned twice by independent implementations. The artifact
  # holds the whole aggregate (private, for debugging) plus publish/ (the only
  # part the publish job ever copies).
  aggregate:
    name: Aggregate
    needs: [build, probe, micro, run]
    # Runs after failed legs too, so the surviving legs still aggregate. It is
    # skipped when run itself was skipped (probe_only, or a failed build/micro).
    if: ${{ !cancelled() && needs.run.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Scripts and the benchsite tool come from the workflow's own commit.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Assert Go toolchain
        run: bash .github/scripts/assert-go-toolchain.sh

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: bin

      - name: Download probe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: env-probe
          path: probe

      - name: Download micro results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: micro
          path: micro

      - name: Download leg results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: results

      - name: Aggregate
        env:
          OUT: bench-results-${{ github.run_id }}
          IN_REPEATS: ${{ inputs.repeats }}
          SCENARIOS: ${{ needs.build.outputs.scenarios }}
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          chmod +x bin/vcs-benchkit
          want=$(( IN_REPEATS * $(jq length <<<"$SCENARIOS") ))
          legs="$(find results -name leg.json 2>/dev/null | wc -l)"
          if [ "$legs" -ne "$want" ]; then
            echo "::warning::aggregating $legs of $want legs (run job result: $RUN_RESULT); the statistics cover the surviving legs only"
            echo "PARTIAL: $legs of $want legs aggregated (run job result: $RUN_RESULT)" >> "$GITHUB_STEP_SUMMARY"
          fi
          # aggregate prints its table to this log; capture its status so the
          # summary is written even when it fails, then fail the step with it.
          status=0
          bin/vcs-benchkit aggregate --in results --out "$OUT" || status=$?
          if [ -f "$OUT/aggregate.md" ]; then
            # It carries its own "### Aggregate: k of m legs finished" heading.
            cat "$OUT/aggregate.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$OUT/aggregate.csv" ]; then
            {
              echo "### Aggregate (median, min, max across repeats)"
              echo
              echo '```'
              cat "$OUT/aggregate.csv"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # The typed schema is the allowlist: anything it has no field for (host
      # labels, logs, errors, notes) does not reach publish/.
      - name: Build publish set
        env:
          OUT: bench-results-${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bin/vcs-benchkit publishset \
            --in "$OUT" \
            --micro micro \
            --build bin/build.json \
            --probe probe/env-probe.json \
            --run-url "$RUN_URL" \
            --out "$OUT/publish"

      # Scan 1 (Go). The runner's own host names are extra literals.
      - name: Scan publish set (Go)
        env:
          OUT: bench-results-${{ github.run_id }}
        run: |
          go run ./tools/benchsite scan --dir "$OUT/publish" --extra "$(hostname)" --extra "$(hostname -f 2>/dev/null || hostname)"

      # Scan 2 (shell + jq), after its own fixture self-test. Run here as a
      # preview so a finding fails the run before the publish job starts.
      - name: Scan publish set (shell)
        env:
          OUT: bench-results-${{ github.run_id }}
        run: |
          bash .github/scripts/bench-scan_test.sh
          bash .github/scripts/bench-scan.sh "$OUT/publish" "$(hostname)" "$(hostname -f 2>/dev/null || hostname)"

      - name: Upload aggregate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results-${{ github.run_id }}
          # Only the scanned publish set and the summary leave the job; the raw
          # aggregate directory is never uploaded (only publish/ is scanned).
          path: |
            bench-results-${{ github.run_id }}/publish
            bench-results-${{ github.run_id }}/aggregate.md
          if-no-files-found: error

  # The only job with contents: write. It has no Go and no third-party code: it
  # re-runs the shell scan on what it is about to push, then pushes to the
  # orphan bench-results branch only (a literal refspec, never an input).
  publish:
    name: Publish
    needs: aggregate
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && needs.aggregate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download aggregate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-results-${{ github.run_id }}
          path: aggregate

      - name: Scan publish set (shell)
        run: |
          bash .github/scripts/bench-scan_test.sh
          bash .github/scripts/bench-scan.sh aggregate/publish "$(hostname)" "$(hostname -f 2>/dev/null || hostname)"

      - name: Push to bench-results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          src="$PWD/aggregate/publish"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          dest="runs/$(date -u +%F)-${RUN_ID}"
          mkdir pub
          cd pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$remote" bench-results >/dev/null 2>&1; then
            git fetch -q --depth 1 "$remote" bench-results
            git switch -q -c bench-results FETCH_HEAD
          else
            git switch -q --orphan bench-results
          fi
          mkdir -p "$dest"
          cp -R "$src"/. "$dest"/
          git add "$dest"
          git commit -q -m "bench results: run ${RUN_ID}"
          git push "$remote" HEAD:refs/heads/bench-results

  render:
    name: Render site
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout results
        uses: actions/checkout@v7
        with:
          ref: bench-results
          path: results
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Assert Go toolchain
        run: bash .github/scripts/assert-go-toolchain.sh

      - name: Render site
        run: go run ./tools/benchsite render -in results/runs -out site

      - name: Scan site
        run: go run ./tools/benchsite scan --dir site --extra "$(hostname)" --extra "$(hostname -f 2>/dev/null || hostname)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # The only job with pages: write and id-token: write.
  deploy:
    name: Deploy site
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
