name: Go dependency updates

# Replaces Dependabot's gomod ecosystem, which cannot resolve this module:
# srspb/, voicecontrolpb/, vcsauthpb/ and graphql/generated/ are gitignored
# and generated in CI, so Dependabot's `go get` fails on the missing packages.
#
# Portable: the only repo-specific parts are env.GO_DEPS_EXCLUDE,
# env.GO_BUILD_TAGS and the "Generate code" step. The client repo carries a
# copy of this file that differs only there.
#
# Least privilege (two jobs plus a preflight):
#   - `update` runs third-party code (code generators, `go get`, the tests)
#     and therefore holds NO secret and only a read token.
#   - `open-pr` holds DEPS_BOT_TOKEN and runs NO Go code at all: it only
#     applies go.mod/go.sum from `update`'s artifact, commits, pushes a dated
#     branch and opens the PR.
# A PR opened with GITHUB_TOKEN would not trigger the `pull_request` CI, which
# is why a separate token (fine-grained PAT or GitHub App token) is needed.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-deps
  cancel-in-progress: false

env:
  # Excluded until track UP lands the Wails GA upgrade.
  GO_DEPS_EXCLUDE: github.com/wailsapp/wails/v3
  GO_BUILD_TAGS: headless

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check DEPS_BOT_TOKEN
        env:
          DEPS_BOT_TOKEN: ${{ secrets.DEPS_BOT_TOKEN }}
        run: |
          if [ -z "$DEPS_BOT_TOKEN" ]; then
            echo "::error title=DEPS_BOT_TOKEN missing::Create a fine-grained PAT or GitHub App token for this repository with Contents: read/write and Pull requests: read/write, and store it as the Actions secret DEPS_BOT_TOKEN. PRs opened with GITHUB_TOKEN would not run CI."
            exit 1
          fi
          echo "DEPS_BOT_TOKEN is set."

  update:
    name: Update and test
    needs: preflight
    runs-on: ubuntu-latest
    # No secrets in this job: it runs third-party code.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Assert Go toolchain
        run: bash .github/scripts/assert-go-toolchain.sh

      # First pass: `go get`/`go mod tidy` must be able to resolve the
      # module's own (gitignored, generated) packages.
      - name: Generate code
        uses: ./.github/actions/generate

      - name: Update direct dependencies
        run: bash .github/scripts/go-deps-update.sh

      # Second pass, after the bump: the generators are derived from go.mod
      # (protoc-gen-go from google.golang.org/protobuf, gqlgen in-module), so
      # the build and tests below must compile code produced by the BUMPED
      # generators, not by the pre-bump ones. Idempotent: protoc output and
      # graphql/generated/ are overwritten.
      - name: Regenerate code with the updated modules
        uses: ./.github/actions/generate

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Go dependency updates."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: go build -tags "$GO_BUILD_TAGS" ./...

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: go test -race -count=1 -tags "$GO_BUILD_TAGS" ./...

      - name: Write PR body
        if: steps.diff.outputs.changed == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Weekly update of the direct Go dependencies (excluded: \`${GO_DEPS_EXCLUDE:-none}\`)."
            echo
            echo '```diff'
            git diff -- go.mod
            echo '```'
            echo
            echo "Tested in $RUN_URL"
          } > pr-body.md

      - name: Upload result
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-deps
          path: |
            go.mod
            go.sum
            pr-body.md
          if-no-files-found: error

  open-pr:
    name: Open PR
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # This job holds DEPS_BOT_TOKEN, so it deliberately runs no `go` command
    # and no code from the updated dependencies: it only applies the
    # artifact's go.mod/go.sum, commits, pushes and opens the PR.
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.DEPS_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.DEPS_BOT_TOKEN }}

      - name: Check for an open deps PR
        id: existing
        run: |
          open="$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|startswith("deps/go-"))]|length')"
          if [ "$open" -gt 0 ]; then
            echo "::notice::An open deps/go-* PR already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download result
        if: steps.existing.outputs.skip == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-deps
          path: .

      - name: Commit and push
        if: steps.existing.outputs.skip == 'false'
        run: |
          # The run id makes the branch unique: a second run on the same day
          # (e.g. a manual dispatch after the earlier PR was closed unmerged,
          # leaving its branch behind) must not collide with an existing
          # remote branch, and this job never force-pushes.
          branch="deps/go-$(date -u +%F)-${GITHUB_RUN_ID}"
          echo "DEPS_BRANCH=$branch" >> "$GITHUB_ENV"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "chore(deps): weekly Go dependency update"
          git push origin HEAD

      - name: Open PR
        if: steps.existing.outputs.skip == 'false'
        run: |
          gh pr create --base main --head "$DEPS_BRANCH" --title "chore(deps): weekly Go dependency update ($(date -u +%F))" --body-file pr-body.md
