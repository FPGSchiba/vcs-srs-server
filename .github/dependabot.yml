version: 2

# Each ecosystem is grouped into a single PR per area: frontend (npm) and
# cicd (GitHub Actions + the build image).
#
# Go modules are NOT updated by Dependabot: they are updated by
# .github/workflows/go-deps.yml, because Dependabot cannot resolve the
# gitignored generated packages (srspb, voicecontrolpb, vcsauthpb,
# graphql/generated) that the module imports.
#
# Every area declares TWO groups. A group covers version updates only unless
# it sets `applies-to: security-updates`, so without the second group
# Dependabot opens one ungrouped PR per advisory — which is how the 7 separate
# npm PRs (nanoid, postcss, brace-expansion, immutable, ...) appeared
# alongside the grouped `all-npm` PR.
#
# Dependabot cannot combine ecosystems into one PR, so docker and
# github-actions share the `cicd` name but still open separate PRs.
updates:
  # Frontend - npm packages in /frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # moves only with go.mod's Wails (TestWailsRuntimeMatchesGoModule); wails-check.yml reports new releases
      - dependency-name: "@wailsio/runtime"
    groups:
      frontend:
        applies-to: version-updates
        patterns:
          - "*"
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # CI/CD - GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cicd:
        applies-to: version-updates
        patterns:
          - "*"
      cicd-security:
        applies-to: security-updates
        patterns:
          - "*"

  # CI/CD - build image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cicd:
        applies-to: version-updates
        patterns:
          - "*"
      cicd-security:
        applies-to: security-updates
        patterns:
          - "*"
