{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#555;--line:#c8c8c8;--band:#fff4cf;--c1:#1f5fbf;--c2:#b33a00;--grid:#e2e2e2}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e8e8e8;--muted:#a8a8a8;--line:#444;--band:#4a3d12;--c1:#7db0ff;--c2:#ff9d66;--grid:#2c2f33}}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;margin:0 auto;max-width:1200px;padding:0 16px 48px}
.label{background:var(--band);border:1px solid var(--line);padding:8px 12px;margin:16px 0;font-weight:600}
table{border-collapse:collapse;display:block;overflow-x:auto;margin:8px 0 16px}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
th{font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 16px}
dt{color:var(--muted)}dd{margin:0}
svg{max-width:100%;height:auto}
svg text{fill:var(--fg);font:11px system-ui,sans-serif}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .axis{stroke:var(--muted);stroke-width:1;fill:none}
svg .loss{stroke:var(--c1);fill:none;stroke-width:2}
svg .p99{stroke:var(--c2);fill:none;stroke-width:2;stroke-dasharray:6 3}
svg .lossdot{fill:var(--c1)}svg .p99dot{fill:var(--c2)}
</style>
</head>
<body>
<div class="label" role="note">{{.Label}}</div>
{{end}}
{{define "foot"}}<p class="note">Generated by tools/benchsite (static, no scripts, no external resources).</p>
</body>
</html>
{{end}}
